<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Accounts | LNMIIT Housing</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      .table-wrapper {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        overflow: hidden;
        border: 1px solid #eee;
      }
      .faculty-table {
        width: 100%;
        border-collapse: collapse;
      }
      .faculty-table th {
        background: #fcfcfc;
        padding: 1.5rem;
        text-align: left;
        font-size: 0.8rem;
        color: var(--text-light);
        border-bottom: 2px solid #eee;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .faculty-table td {
        padding: 1.5rem;
        border-bottom: 1px solid #f5f5f5;
        font-size: 0.95rem;
        color: var(--text-dark);
      }
      .faculty-table tr:hover {
        background: #fafafa;
      }
    </style>
  </head>
  <body style="background: #f8f9fa">
    <nav
      class="glass-nav scrolled"
      style="background: white; border-bottom: 1px solid #eee"
    >
      <div style="display: flex; align-items: center; gap: 1rem">
        <div class="logo" style="color: var(--teal-main)">
          LNMIIT<span>HOUSING</span>
        </div>
      </div>
      <ul class="nav-links">
        <li><a href="/" class="active">Back to Dashboard</a></li>
      </ul>
    </nav>

    <div
      style="
        max-width: 1400px;
        margin: 0 auto;
        padding: 2rem;
        margin-top: 100px;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 2.5rem;
          margin-top: 1rem;
        "
      >
        <div>
          <h1 style="font-size: 2.5rem; color: var(--text-dark); margin: 0">
            Faculty Accounts
          </h1>
          <p style="color: var(--text-light); margin-top: 0.5rem">
            System Management > Accounts
          </p>
        </div>
        <button class="flash-btn" onclick="showModal('addFacultyModal')">
          + Register New Faculty
        </button>
      </div>
      <div id="faculty-table-container" class="table-wrapper"></div>
    </div>

    <!-- Add Faculty Modal -->
    <div id="addFacultyModal" class="modal">
      <div class="modal-content" style="max-width: 500px">
        <span class="close" onclick="hideModal('addFacultyModal')"
          >&times;</span
        >
        <h2 style="color: var(--teal-dark); margin-bottom: 1.5rem">
          Register Faculty
        </h2>
        <form id="add-faculty-form">
          <div class="form-group">
            <label>Faculty ID (Unique)</label>
            <input
              type="text"
              name="facultyId"
              required
              placeholder="e.g. F001"
              style="
                width: 100%;
                padding: 0.8rem;
                border: 1px solid #ddd;
                border-radius: 8px;
              "
            />
          </div>
          <div class="form-group">
            <label>Full Name</label>
            <input
              type="text"
              name="name"
              required
              placeholder="Full Name"
              style="
                width: 100%;
                padding: 0.8rem;
                border: 1px solid #ddd;
                border-radius: 8px;
              "
            />
          </div>
          <div class="form-group" style="margin-bottom: 1rem">
            <label>Role</label>
            <select
              name="role"
              required
              style="
                width: 100%;
                padding: 0.8rem;
                border: 1px solid #ddd;
                border-radius: 8px;
              "
            >
              <option value="Professor">Professor</option>
              <option value="Associate Professor">Associate Professor</option>
              <option value="Assistant Professor">Assistant Professor</option>
              <option value="Staff">Staff</option>
              <option value="Warden">Warden</option>
            </select>
          </div>
          <div class="form-group">
            <label>Department</label>
            <input
              type="text"
              name="department"
              required
              placeholder="Department"
              style="
                width: 100%;
                padding: 0.8rem;
                border: 1px solid #ddd;
                border-radius: 8px;
              "
            />
          </div>
          <p style="font-size: 0.75rem; color: #999; margin-bottom: 1rem">
            Default password will be <strong>FacultyID@123</strong>
          </p>
          <button type="submit" class="btn-teal" style="width: 100%">
            Create Account
          </button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = "/api";

      function showModal(id) {
        document.getElementById(id).style.display = "block";
        document.body.classList.add("no-scroll");
      }

      function hideModal(id) {
        document.getElementById(id).style.display = "none";
        document.body.classList.remove("no-scroll");
      }

      // fetch and show all faculty in a table
      async function loadFacultyList() {
        const res = await fetch(`${API_URL}/faculty`);
        const facultyList = await res.json();
        const container = document.getElementById("faculty-table-container");

        container.innerHTML = `
              <table class="faculty-table">
                  <thead>
                      <tr>
                          <th>Faculty ID</th>
                          <th>Name</th>
                          <th>Role</th>
                          <th>Department</th>
                          <th>Status</th>
                      </tr>
                  </thead>
                  <tbody>
                      ${facultyList
                        .map(
                          (f) => `
                          <tr>
                              <td style="font-weight: 700;">${f.facultyId}</td>
                              <td>${f.name}</td>
                              <td>${f.role}</td>
                              <td>${f.department}</td>
                              <td>
                                  <span style="color: #27ae60; font-weight: 600;">Active</span>
                              </td>
                          </tr>
                      `,
                        )
                        .join("")}
                  </tbody>
              </table>
          `;
      }

      document
        .getElementById("add-faculty-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          try {
            const res = await fetch(`${API_URL}/faculty`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(data),
            });

            if (res.ok) {
              alert("Faculty account created successfully!");
              hideModal("addFacultyModal");
              loadFacultyList(); // refresh the table
            } else {
              const err = await res.json();
              alert(err.message);
            }
          } catch (err) {
            alert("Error creating account");
          }
        });

      window.onload = () => {
        const role = localStorage.getItem("userRole");
        if (role !== "admin") {
          window.location.href = "/";
          return;
        }
        loadFacultyList();
      };
    </script>
  </body>
</html>
