<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Global Inventory | LNMIIT Housing</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      .admin-table-wrapper {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        overflow: hidden;
        border: 1px solid #eee;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
      }
      .admin-table th {
        background: #fcfcfc;
        padding: 1.5rem;
        text-align: left;
        font-size: 0.8rem;
        color: var(--text-light);
        border-bottom: 2px solid #eee;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .admin-table td {
        padding: 1.5rem;
        border-bottom: 1px solid #f5f5f5;
        font-size: 0.95rem;
        color: var(--text-dark);
      }
      .admin-table tr:hover {
        background: #fafafa;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: var(--teal-main);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0;
        transition: 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        transform: translateX(-5px);
      }
    </style>
  </head>
  <body style="background: #f8f9fa;">
    <!-- Navigation Bar -->
    <nav class="glass-nav scrolled" style="background: white; border-bottom: 1px solid #eee;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="logo" style="color: var(--teal-main);">LNMIIT<span>HOUSING</span></div>
      </div>
      <ul class="nav-links">
        <li><a href="/" class="active">Back to Dashboard</a></li>
      </ul>
    </nav>

    <div style="max-width: 1400px; margin: 0 auto; padding: 2rem; margin-top: 100px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; margin-top: 1rem;">
        <div>
          <h1 style="font-size: 2.5rem; color: var(--text-dark); margin: 0;">Global Inventory</h1>
          <p style="color: var(--text-light); margin-top: 0.5rem;">System Management > Inventory</p>
        </div>
        <button class="flash-btn" onclick="showModal('addModal')">+ Add New Item</button>
      </div>
      <div id="global-inventory-table-container" class="admin-table-wrapper"></div>
    </div>

    <!-- Modals (Reused from main page) -->
    <div id="addModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="hideModal('addModal')">&times;</span>
        <h2>Add Asset/Item</h2>
        <form id="add-item-form">
          <div class="form-group">
            <label>Assign to Unit</label>
            <select name="apartmentId" id="apt-select" required>
              <option value="">-- Select Unit --</option>
              <!-- Populate via JS -->
            </select>
          </div>
          <div class="form-group">
            <label>Item Name</label>
            <input type="text" name="itemName" placeholder="e.g. Wooden Bed" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Quantity</label>
              <input type="number" name="quantity" value="1" min="1" required />
            </div>
            <div class="form-group">
              <label>Condition</label>
              <select name="condition">
                <option value="New">New</option>
                <option value="Good">Good</option>
                <option value="Damaged">Damaged</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-submit">Add to Inventory</button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = '/api';

      function showModal(id) { 
        document.getElementById(id).style.display = 'block'; 
        document.body.classList.add('no-scroll');
      }
      function hideModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        document.body.classList.remove('no-scroll');
      }

      async function loadInventory() {
          const res = await fetch(`${API_URL}/inventory`);
          const items = await res.json();
          const container = document.getElementById('global-inventory-table-container');
          
          container.innerHTML = `
              <table class="admin-table">
                  <thead>
                      <tr>
                          <th>Item Name</th>
                          <th>Belongs To Unit</th>
                          <th>Quantity</th>
                          <th>Condition</th>
                          <th>Actions</th>
                      </tr>
                  </thead>
                  <tbody>
                      ${items.map(i => `
                          <tr>
                              <td style="font-weight: 600;">${i.itemName}</td>
                              <td>
                                ${i.apartmentId ? `
                                  <div style="font-weight: 700; color: var(--teal-dark);">Unit ${i.apartmentId.apartmentNumber}</div>
                                  <div style="font-size: 0.75rem; color: #999;">${i.apartmentId.block}</div>
                                ` : '<span style="color: #ccc;">Unassigned</span>'}
                              </td>
                              <td>${i.quantity}</td>
                              <td>
                                  <span style="color: ${i.condition === 'Good' || i.condition === 'New' ? '#27ae60' : '#ff4757'}; font-weight: 600;">
                                      ${i.condition}
                                  </span>
                              </td>
                              <td>
                                  <button class="action-icon-btn" onclick="deleteItem('${i._id}')">
                                      <img src="https://img.icons8.com/ios-glyphs/24/ff4757/delete-forever.png" width="18"/>
                                  </button>
                              </td>
                          </tr>
                      `).join('')}
                  </tbody>
              </table>
          `;
      }

      async function deleteItem(id) {
          if(!confirm('Delete this item?')) return;
          await fetch(`${API_URL}/inventory/${id}`, { method: 'DELETE' });
          loadInventory();
      }

      document.getElementById('add-item-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());

          await fetch(`${API_URL}/inventory`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
          });
          hideModal('addModal');
          loadInventory();
      });

      async function loadApartments() {
          const res = await fetch(`${API_URL}/apartments`);
          const apartments = await res.json();
          const select = document.getElementById('apt-select');
          select.innerHTML += apartments.map(a => `<option value="${a._id}">Unit ${a.apartmentNumber} (${a.block})</option>`).join('');
      }

      window.onload = () => {
          const role = localStorage.getItem('userRole');
          if (role !== 'admin') { window.location.href = '/'; return; }
          loadInventory();
          loadApartments();
      };
    </script>
  </body>
</html>
