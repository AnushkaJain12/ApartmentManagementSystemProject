<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Apartments | LNMIIT Housing</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      .admin-table-wrapper {
        background: #fff;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        overflow: hidden;
        border: 1px solid #eee;
      }
      .admin-table {
        width: 100%;
        border-collapse: collapse;
      }
      .admin-table th {
        background: #fcfcfc;
        padding: 1.5rem;
        text-align: left;
        font-size: 0.8rem;
        color: var(--text-light);
        border-bottom: 2px solid #eee;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .admin-table td {
        padding: 1.5rem;
        border-bottom: 1px solid #f5f5f5;
        font-size: 0.95rem;
        color: var(--text-dark);
      }
      .admin-table tr:hover {
        background: #fafafa;
      }
      .back-btn {
        background: transparent;
        border: none;
        color: var(--teal-main);
        font-weight: 700;
        cursor: pointer;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 0;
        transition: 0.2s;
        text-decoration: none;
      }
      .back-btn:hover {
        transform: translateX(-5px);
      }
    </style>
  </head>
  <body style="background: #f8f9fa;">
    <nav class="glass-nav scrolled" style="background: white; border-bottom: 1px solid #eee;">
      <div style="display: flex; align-items: center; gap: 1rem;">
        <div class="logo" style="color: var(--teal-main);">LNMIIT<span>HOUSING</span></div>
      </div>
      <ul class="nav-links">
        <li><a href="/" class="active">Back to Dashboard</a></li>
      </ul>
    </nav>

    <div style="max-width: 1400px; margin: 0 auto; padding: 2rem; margin-top: 100px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; margin-top: 1rem;">
        <div>
          <h1 style="font-size: 2.5rem; color: var(--text-dark); margin: 0;">Apartment Units</h1>
          <p style="color: var(--text-light); margin-top: 0.5rem;">System Management > Apartments</p>
        </div>
        <button class="flash-btn" onclick="showModal('addModal')">+ Add Apartment</button>
      </div>
      <div id="apartments-table-container" class="admin-table-wrapper"></div>
    </div>

    <!-- Modals -->
    <div id="addModal" class="modal">
      <div class="modal-content">
        <span class="close" onclick="hideModal('addModal')">&times;</span>
        <h2>Add New Apartment</h2>
        <form id="add-apartment-form">
          <div class="form-group">
            <label>Housing Block</label>
            <select name="block" required>
              <option value="Professor Housing">Professor Housing</option>
              <option value="Associate Professor Housing">Associate Professor Housing</option>
              <option value="Assistant Professor Housing">Assistant Professor Housing</option>
              <option value="Grade 3 Housing">Grade 3 Housing</option>
              <option value="Grade 4 Housing">Grade 4 Housing</option>
            </select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Apartment No.</label>
              <input type="number" name="apartmentNumber" required />
            </div>
            <div class="form-group">
              <label>Type</label>
              <select name="type">
                <option value="1BHK">1BHK</option>
                <option value="2BHK">2BHK</option>
                <option value="3BHK">3BHK</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-submit">Register Unit</button>
        </form>
      </div>
    </div>

    <script>
      const API_URL = '/api';

      function showModal(id) { 
        document.getElementById(id).style.display = 'block'; 
        document.body.classList.add('no-scroll');
      }
      function hideModal(id) { 
        document.getElementById(id).style.display = 'none'; 
        document.body.classList.remove('no-scroll');
      }

      async function loadApartments() {
          const res = await fetch(`${API_URL}/apartments`);
          const apartments = await res.json();
          const container = document.getElementById('apartments-table-container');
          
          container.innerHTML = `
              <table class="admin-table">
                  <thead>
                      <tr>
                          <th>Unit No.</th>
                          <th>Block</th>
                          <th>Type</th>
                          <th>Status</th>
                          <th>Occupant</th>
                          <th>Actions</th>
                      </tr>
                  </thead>
                  <tbody>
                      ${apartments.map(a => `
                          <tr>
                              <td style="font-weight: 700;">Unit ${a.apartmentNumber}</td>
                              <td>${a.block}</td>
                              <td>${a.type}</td>
                              <td>
                                  <span style="color: ${a.status === 'Occupied' ? '#27ae60' : '#ff4757'}; font-weight: 600;">
                                      ${a.status}
                                  </span>
                              </td>
                              <td>${a.occupantName || '—'}</td>
                              <td>
                                  <button class="action-icon-btn" onclick="deleteApartment('${a._id}')">
                                      <img src="https://img.icons8.com/ios-glyphs/24/ff4757/delete-forever.png" width="18"/>
                                  </button>
                              </td>
                          </tr>
                      `).join('')}
                  </tbody>
              </table>
          `;
      }

      async function deleteApartment(id) {
          if(!confirm('Delete this unit?')) return;
          await fetch(`${API_URL}/apartments/${id}`, { method: 'DELETE' });
          loadApartments();
      }

      document.getElementById('add-apartment-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(e.target);
          const data = Object.fromEntries(formData.entries());
          data.capacity = data.type === '3BHK' ? 6 : (data.type === '2BHK' ? 4 : 2);
          
          await fetch(`${API_URL}/apartments`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
          });
          hideModal('addModal');
          loadApartments();
      });

      window.onload = () => {
          const role = localStorage.getItem('userRole');
          if (role !== 'admin') { window.location.href = '/'; return; }
          loadApartments();
      };
    </script>
  </body>
</html>
